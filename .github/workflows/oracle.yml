name: oracle

# The steps of scripts/ci-oracle.sh, which run the Go reference live: on demand, once a week, and when a change
# touches the interpreter, the conformance tools or the lock file.

on:
  push:
    branches: [main]
    paths:
      - 'conformance/**'
      - 'crates/**'
      - 'Cargo.lock'
      - 'scripts/ci-oracle.sh'
  pull_request:
    paths:
      - 'conformance/**'
      - 'crates/**'
      - 'Cargo.lock'
      - 'scripts/ci-oracle.sh'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: conformance/oracle-go/go.sum
      # A cache of its own: this job builds in release mode too, and a cache key is written once.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-oracle-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-oracle-${{ runner.os }}-
      # The script builds the reference with GOPROXY=off, so its modules must be in the module cache first.
      - run: go mod download
        working-directory: conformance/oracle-go
      # rustup installs the toolchain of rust-toolchain.toml on first use.
      - run: scripts/ci-oracle.sh
