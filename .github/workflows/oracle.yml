name: oracle

# The steps of scripts/ci-oracle.sh, which run the Go reference live: on demand, once a week, and when a change
# touches the interpreter, the conformance tools, the profile, the workspace manifest, the lock file, the toolchain
# or this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'conformance/**'
      - 'crates/**'
      - 'profile/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/ci-oracle.sh'
      - '.github/workflows/oracle.yml'
  pull_request:
    paths:
      - 'conformance/**'
      - 'crates/**'
      - 'profile/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/ci-oracle.sh'
      - '.github/workflows/oracle.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: conformance/oracle-go/go.sum
      # A cache of its own: this job builds in release mode too, and a cache key is written once.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-oracle-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-oracle-${{ runner.os }}-
      # The script builds the reference with GOPROXY=off, so its modules must be in the module cache first.
      - run: go mod download
        working-directory: conformance/oracle-go
      # rustup installs the toolchain of rust-toolchain.toml on first use.
      - run: scripts/ci-oracle.sh
